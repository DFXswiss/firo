name: DFX Develop CI

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/README.md'
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and test firod image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t firod-ci .
