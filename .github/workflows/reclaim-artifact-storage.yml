name: Reclaim Actions storage

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/reclaim-artifact-storage.yml"

permissions:
  actions: write
  contents: read

jobs:
  reclaim:
    name: Delete stored Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete Actions artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          cutoff_epoch=$(($(date -u +%s) - 86400))
          while :; do
            page=1
            old_ids=""
            while :; do
              json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")
              page_old_ids=$(printf '%s' "$json" | jq -r --argjson cutoff "$cutoff_epoch" '
                .artifacts[]
                | select((.created_at | fromdateiso8601) < $cutoff)
                | .id
              ')
              if [ -n "$page_old_ids" ]; then
                if [ -n "$old_ids" ]; then
                  old_ids="${old_ids}"$'\n'"${page_old_ids}"
                else
                  old_ids="${page_old_ids}"
                fi
              fi
              page_count=$(printf '%s' "$json" | jq '.artifacts | length')
              if [ "$page_count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
            if [ -z "$old_ids" ]; then
              echo "Deleted ${deleted} artifacts older than 24 hours."
              break
            fi
            count=0
            while read -r id; do
              [ -z "$id" ] && continue
              set +e
              err=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent 2>&1)
              status=$?
              set -e
              if [ "$status" -ne 0 ]; then
                if ! printf '%s' "$err" | grep -qiE '404|Not Found'; then
                  printf '%s\n' "$err" >&2
                  exit "$status"
                fi
              else
                count=$((count + 1))
              fi
            done <<< "$old_ids"
            deleted=$((deleted + count))
            if [ "$count" -eq 0 ]; then
              echo "Deleted ${deleted} artifacts older than 24 hours."
              break
            fi
          done
