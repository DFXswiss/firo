name: Upstream release check

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/upstream-release-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream consensus deadline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check upstream release for consensus deadline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases_json=$(gh api "repos/firoorg/firo/releases?per_page=100")

          marker_releases="[]"

          release_count=$(printf '%s' "$releases_json" | jq 'length')
          idx=0
          while [ "$idx" -lt "$release_count" ]; do
            release_json=$(printf '%s' "$releases_json" | jq -c --argjson idx "$idx" '.[$idx]')
            draft=$(printf '%s' "$release_json" | jq -r '.draft')
            prerelease=$(printf '%s' "$release_json" | jq -r '.prerelease')
            idx=$((idx + 1))
            if [ "$draft" = "true" ] || [ "$prerelease" = "true" ]; then
              continue
            fi

            cand_body=$(printf '%s' "$release_json" | jq -r '.body // ""')
            # Collapse whitespace (including newlines) so line-wrapped markers still match.
            cand_body=$(printf '%s' "$cand_body" | tr -s '[:space:]' ' ')

            cand_deadline_height=""
            set +e
            height_match=$(printf '%s' "$cand_body" | grep -oiE '(before|prior to)([[:space:]]+(block|height)){1,2}[[:space:]]*#?[0-9][0-9,.]*')
            height_status=$?
            set -e
            if [ "$height_status" -eq 0 ]; then
              cand_deadline_height=$(printf '%s' "$height_match" | grep -oE '[0-9][0-9,.]*' | tr -d ',.')
              cand_deadline_height=${cand_deadline_height%%$'\n'*}
            elif [ "$height_status" -ne 1 ]; then
              exit "$height_status"
            fi

            cand_is_hard_fork=0
            if printf '%s' "$cand_body" | grep -qiE 'hard[[:space:]-]?fork|hardfork'; then
              cand_is_hard_fork=1
            fi

            if [ -z "$cand_deadline_height" ] && [ "$cand_is_hard_fork" -eq 0 ]; then
              continue
            fi

            cand_entry=$(printf '%s' "$release_json" | jq -c \
              --arg height "$cand_deadline_height" \
              --argjson hf "$cand_is_hard_fork" \
              '{tag_name: .tag_name, html_url: .html_url, published_at: .published_at, deadline_height: $height, is_hard_fork: $hf}')
            marker_releases=$(printf '%s' "$marker_releases" | jq -c --argjson entry "$cand_entry" '. + [$entry]')
          done

          marker_count=$(printf '%s' "$marker_releases" | jq 'length')
          if [ "$marker_count" -eq 0 ]; then
            echo "No consensus deadline marker in recent upstream releases."
            exit 0
          fi

          not_contained="[]"
          midx=0
          while [ "$midx" -lt "$marker_count" ]; do
            entry=$(printf '%s' "$marker_releases" | jq -c --argjson i "$midx" '.[$i]')
            midx=$((midx + 1))

            tag_name=$(printf '%s' "$entry" | jq -r '.tag_name')
            commit_sha=$(gh api "repos/firoorg/firo/commits/${tag_name}" --jq '.sha')
            develop_ahead_by=$(gh api "repos/${{ github.repository }}/compare/develop...${commit_sha}" --jq '.ahead_by')
            main_ahead_by=$(gh api "repos/${{ github.repository }}/compare/main...${commit_sha}" --jq '.ahead_by')

            if [ "$develop_ahead_by" -eq 0 ] && [ "$main_ahead_by" -eq 0 ]; then
              continue
            fi

            not_contained=$(printf '%s' "$not_contained" | jq -c \
              --argjson entry "$entry" \
              --argjson d "$develop_ahead_by" \
              --argjson m "$main_ahead_by" \
              '. + [$entry + {develop_ahead_by: $d, main_ahead_by: $m}]')
          done

          title_prefix="Upstream consensus deadline:"

          not_contained_count=$(printf '%s' "$not_contained" | jq 'length')
          if [ "$not_contained_count" -eq 0 ]; then
            tag_name=$(printf '%s' "$marker_releases" | jq -r 'sort_by(.published_at) | reverse | .[0].tag_name')
            echo "Fork already contains upstream release ${tag_name} on develop and main."
            existing_numbers=$(gh api --paginate --slurp "repos/${{ github.repository }}/issues?state=open&per_page=100" \
              | jq -r --arg prefix "$title_prefix" 'add | [.[] | select(has("pull_request") | not) | select(.user.login == "github-actions[bot]") | select(.title | startswith($prefix))] | .[].number')
            if [ -n "$existing_numbers" ]; then
              while IFS= read -r existing_number; do
                [ -n "$existing_number" ] || continue
                gh api -X POST "repos/${{ github.repository }}/issues/${existing_number}/comments" \
                  -f body="The fork now contains upstream release ${tag_name} on develop and main." >/dev/null
                set +e
                gh api -X PATCH "repos/${{ github.repository }}/issues/${existing_number}" \
                  -f state=closed >/dev/null
                set -e
                # Distinguish "already closed" from a failed close: read state back.
                issue_state=$(gh api "repos/${{ github.repository }}/issues/${existing_number}" --jq '.state')
                if [ "$issue_state" = "closed" ]; then
                  echo "Closed tracking issue #${existing_number} for upstream release ${tag_name}."
                else
                  echo "Failed to close tracking issue #${existing_number} (state=${issue_state})." >&2
                  exit 1
                fi
              done <<< "$existing_numbers"
            fi
            exit 0
          fi

          chosen=$(printf '%s' "$not_contained" | jq -c 'sort_by(.published_at) | reverse | .[0]')
          tag_name=$(printf '%s' "$chosen" | jq -r '.tag_name')
          html_url=$(printf '%s' "$chosen" | jq -r '.html_url')
          published_at=$(printf '%s' "$chosen" | jq -r '.published_at')
          deadline_height=$(printf '%s' "$chosen" | jq -r '.deadline_height')
          is_hard_fork=$(printf '%s' "$chosen" | jq -r '.is_hard_fork')
          develop_ahead_by=$(printf '%s' "$chosen" | jq -r '.develop_ahead_by')
          main_ahead_by=$(printf '%s' "$chosen" | jq -r '.main_ahead_by')

          title="${title_prefix} ${tag_name}"

          issue_body="Upstream release: ${tag_name}"$'\n'
          if [ -n "$deadline_height" ]; then
            issue_body+="Consensus deadline height: ${deadline_height}"$'\n'
          fi
          if [ "$is_hard_fork" -eq 1 ]; then
            issue_body+="The release notes mention a hard fork."$'\n'
          fi
          issue_body+="Published: ${published_at}"$'\n'
          issue_body+="Release: ${html_url}"$'\n'
          if [ "$develop_ahead_by" -gt 0 ]; then
            issue_body+="This fork's develop is ${develop_ahead_by} commits behind that release."$'\n'
          fi
          if [ "$main_ahead_by" -gt 0 ]; then
            issue_body+="This fork's main is ${main_ahead_by} commits behind that release."$'\n'
            issue_body+="A lagging main means the published image does not yet contain the release."
          fi

          existing_number=$(gh api --paginate --slurp "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            | jq --arg prefix "$title_prefix" 'add | [.[] | select(has("pull_request") | not) | select(.user.login == "github-actions[bot]") | select(.title | startswith($prefix))] | .[0].number // empty')

          if [ -n "$existing_number" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/${existing_number}" \
              -f title="$title" \
              -f body="$issue_body" >/dev/null
            echo "Updated issue #${existing_number} for upstream release ${tag_name}."
          else
            gh api -X POST "repos/${{ github.repository }}/issues" \
              -f title="$title" \
              -f body="$issue_body" >/dev/null
            echo "Opened issue for upstream release ${tag_name}."
          fi
